model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"

developer_instructions = """
Trusted-project runtime configuration. Before work, read root AGENTS.md, the scoped AGENTS.md files
needed for touched paths, docs/productionization/AGENT_AUDIT_PROTOCOL.md, and
docs/productionization/HYBRID_CONCURRENCY_PROTOCOL.md. Use the named roles and procedures advertised by
root AGENTS.md; configuration and model self-report are intent, not runtime proof.

Master-only delegation is a behavioral policy, not runtime identity enforcement. Collaboration-control
visibility alone is non-blocking. Do not invoke collaboration controls or delegate nested work. Any
attempted or completed nested delegation is a blocking policy violation. Non-master roles disable nested
agents in their role TOMLs.

Review assurance requires a fresh separate reviewer context, configured read-only intent, non-mutation,
detached exact-head isolation, RED replay, before/after SHA and cleanliness evidence, review freshness,
required CI, and Master-only merge authority. Missing host-origin boundary/tool facts are supplemental
disclosure, not a stop by themselves. Use one production writer, the writer lease, and the root/audit/hybrid
merge boundaries. These settings are prospective: refresh main and start a fresh session after a harness
policy change.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 6

[features]
apps = false
memories = false
