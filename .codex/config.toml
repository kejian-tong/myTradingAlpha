# Project-scoped Codex harness. Loaded only for trusted projects.
# Keep production architecture in docs/productionization; this file controls agent execution only.

model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"

developer_instructions = """
For myTradingAlpha productionization work, read and follow root AGENTS.md,
`docs/productionization/AGENT_AUDIT_PROTOCOL.md`, and
`docs/productionization/HYBRID_CONCURRENCY_PROTOCOL.md` before selecting or spawning roadmap agents.

Use the project-scoped named Codex agents under `.codex/agents/` for every new roadmap PR after this
policy is present on the checked-out base branch:
- normal: `normal_implementer` + controlling `reviewer_high`
- high: `normal_implementer` + controlling `reviewer_high`
- high implementation-only escalation: replace the writer with `high_implementer`; keep `reviewer_high`
- high review-only escalation: retain `normal_implementer`; replace review with `reviewer_xhigh`
- critical: `normal_implementer` + controlling `reviewer_xhigh`
- difficult escalation: `high_implementer` + controlling `reviewer_xhigh`
- hardest escalation: `critical_implementer` + controlling `reviewer_xhigh`
- review-only escalation: retain the existing implementer and use `reviewer_xhigh`
- hybrid read-only specialists: `code_explorer`, `test_auditor`, `boundary_reviewer`

Master uses GPT-5.6 Sol / xhigh (Extra High). reviewer_high and boundary_reviewer use Sol/high;
reviewer_xhigh uses Sol/xhigh. Normal and critical implementation stays on Luna/max. Difficult
escalation uses Sol/high implementation, and the hardest layer uses Sol/xhigh implementation with a
fresh Sol/xhigh reviewer. GPT-6 routes are temporarily disabled. Record the selected route,
evidence-based reason, and affected roles in the JIT and AGENT_STATE.md before spawning. These tiers do
not replace normal/high/critical safety classification, raise concurrency, resolve a human architecture
decision, or waive any stop/promotion gate.

Normal and high intentionally share the initial Luna/max + Sol/high route. Normal remains there unless
new evidence requires reclassification. For high work, implementation complexity alone escalates only
the writer to Sol/high; review ambiguity alone escalates only the reviewer to Sol/xhigh; both together
select the difficult route. Stop the prior writer/reviewer before replacement and record the reason.

Use hybrid concurrency rather than concurrent production writers:
- before the JIT spec, parallelize independent read-only exploration/audit lanes when useful;
- during RED/GREEN/REFACTOR and repair, allow only one production-code writer for the active PR;
- after freezing an exact PR head, the controlling reviewer and relevant read-only specialist lanes may
  review the same exact SHA concurrently;
- after repair, prior review evidence is stale; rerun the controlling reviewer and affected specialist
  lanes against the new exact head;
- collect durable results and close completed subagent threads before spawning replacements when no
  follow-up is expected.

The controlling reviewer required by AGENT_AUDIT_PROTOCOL.md remains mandatory. Specialist lanes are
additional evidence and never self-approve merge. Any unresolved BLOCKER/HIGH from any review lane
blocks the master merge gate. A controlling reviewer verdict of APPROVE means the PR is eligible for
the master merge gate; it does not authorize merge by itself. Only the master/orchestrator may issue
the final MERGE verdict after independently checking all exact-head gates.

Do not substitute a generic/default worker for a required named roadmap role merely because it is
available. If the required named role cannot be spawned with its project configuration, record
`insufficient_evidence` and stop before merge instead of claiming the requested route was used.

For roadmap implementation PRs, preserve auditable red-green-refactor history, persist the independent
controlling-review artifact on the GitHub PR at the exact reviewed head, and persist the master
merge-gate artifact on the GitHub PR at the exact final head before merge, as defined in
AGENT_AUDIT_PROTOCOL.md.

This policy is prospective. Existing running agents retain their loaded routes; do not relabel their
historical evidence. After this harness PR merges, refresh the relevant checkout with main and start a
fresh master/session to load the new project configs. A paused PR may resume with newly loaded roles
only after its existing stop conditions are resolved; do not require that blocked PR to merge first.
New files are configuration intent until the runtime exposes and successfully loads their named roles.
"""

[agents]
enabled = true
# This is a concurrency guardrail, not a lifetime/per-PR spawn cap. The master/root thread is separate.
max_concurrent_threads_per_session = 4
