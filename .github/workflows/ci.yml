name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked environment (with dev extras)
        run: uv sync --locked --extra dev
      - name: Run test suite
        run: uv run --no-sync pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Fresh locked install (no dev extras) and import
        run: uv sync --locked --no-dev --no-editable
      - name: Import installed packages
        run: |
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          uv run --no-sync python -c "from mytradingalpha.contracts import (CURRENT_SCHEMA_VERSION, ContractModel, DecimalString, FoundationReasonCode, MigrationPlan, Mode, RunContext, SchemaRegistry, SchemaRegistryError, StableId, UtcDateTime); import tradingagents, cli.main; print(f'clean-install import OK ({CURRENT_SCHEMA_VERSION}, {Mode.HISTORICAL.value})')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (results/ and worklog/ are excluded via pyproject extend-exclude).
        run: uv run --no-sync ruff check .

  foundation-contract-docs-lock:
    name: Foundation contract/docs/lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Check dependency direction
        run: uv run --no-sync python scripts/check_dependency_direction.py
      - name: Check lock consistency
        run: uv run --no-sync python scripts/check_lock_consistency.py
      - name: Check Markdown contracts
        run: uv run --no-sync python scripts/check_markdown_contracts.py
      - name: Run foundation contract tests
        run: uv run --no-sync pytest -q tests/productionization
